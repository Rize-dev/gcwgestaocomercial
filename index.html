<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCW | Gestão com Wesley - CRM & Financeiro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .sidebar-link.active { background: linear-gradient(90deg, #2563eb 0%, #1d4ed8 100%); color: white; box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.3); }
        .card-hover { transition: all 0.2s ease-in-out; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .modal-overlay { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
        .scrollbar-thin::-webkit-scrollbar { width: 6px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: #f1f5f9; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .logo-container { background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%); }
        .tag { display: inline-block; padding: 4px 12px; border-radius: 9999px; font-size: 12px; font-weight: 600; }
        .tag-green { background: #dcfce7; color: #166534; }
        .tag-blue { background: #dbeafe; color: #1e40af; }
        .tag-yellow { background: #fef9c3; color: #854d0e; }
        .tag-red { background: #fee2e2; color: #991b1b; }
        .tag-purple { background: #f3e8ff; color: #6b21a8; }
        .tag-gray { background: #f1f5f9; color: #475569; }
        .tag-orange { background: #ffedd5; color: #9a3412; }
        .tag-cyan { background: #cffafe; color: #155e75; }
        .tab-active { border-bottom: 3px solid #2563eb; color: #2563eb; font-weight: 600; }
        .bank-card { transition: all 0.2s ease; }
        .bank-card:hover { transform: translateY(-3px); box-shadow: 0 12px 20px -3px rgba(0, 0, 0, 0.15); }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' },
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800">

    <div class="flex h-screen overflow-hidden">

                        <div class="text-3xl font-bold text-white"><span class="text-blue-400">G</span>CW</div>

                    </div>
                </div>
            </div>
            
            <nav class="flex-1 p-4 space-y-1 overflow-y-auto scrollbar-thin">
                <a href="#" onclick="switchPage('dashboard', this)" class="sidebar-link active flex items-center p-3 rounded-lg transition-all">

                <a href="#" onclick="switchPage('parcelamentos', this)" class="sidebar-link flex items-center p-3 rounded-lg hover:bg-slate-800 transition-all text-slate-300">

                </a>
                <a href="#" onclick="switchPage('config', this)" class="sidebar-link flex items-center p-3 rounded-lg hover:bg-slate-800 transition-all text-slate-300">

            <div class="p-4 border-t border-slate-800 text-xs text-slate-500">
                <p>GCW v4.0 - Gestão com Wesley</p>
                <p class="mt-1">Dados salvos localmente</p>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 overflow-y-auto p-6 lg:p-8 bg-slate-50">
            <header class="flex justify-between items-center mb-6">
                <div>
                    <h2 class="text-2xl lg:text-3xl font-bold text-slate-800" id="page-title">Dashboard Executivo</h2>
                    <p class="text-slate-500 text-sm">Visão consolidada e em tempo real do seu negócio</p>
                </div>
                <div class="flex items-center space-x-3">
                    <button class="p-2 text-slate-400 hover:text-slate-600 relative">
                        <i class="fas fa-bell text-xl"></i>
                        <span class="absolute top-0 right-0 bg-red-500 text-white text-[10px] rounded-full h-4 w-4 flex items-center justify-center">2</span>
                    </button>
                    <div class="flex items-center space-x-2 bg-white px-3 py-2 rounded-lg shadow-sm border border-slate-200">
                        <div class="w-8 h-8 bg-primary-600 rounded-full flex items-center justify-center text-white font-bold text-sm">W</div>
                        <span class="font-medium text-sm text-slate-700 hidden sm:inline">Wesley</span>
                    </div>

            </header>

            <div id="pages-container"></div>
        </main>
    </div>

    <!-- MODAL -->
    <div id="modal-overlay" class="fixed inset-0 modal-overlay z-50 hidden flex items-center justify-center p-4">
        <div id="modal-content" class="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto fade-in"></div>
    </div>

    <script>
    // ==========================================

            { id: 'b4', nome: 'Cartão Nubank', tipo: 'CARTÃO DE CRÉDITO', tipoPessoa: 'PF', saldoInicial: 0, cor: '#820AD1', icone: 'fa-credit-card' }
        ],

            { id: 'c1', client: 'Cliente Alpha', value: 25000, status: 'ATIVO', responsible: 'João Silva', origem: 'INDICAÇÃO', motivoPerda: '' },
            { id: 'c2', client: 'Tech Solutions', value: 15000, status: 'ATIVO', responsible: 'Maria Souza', origem: 'BNI', motivoPerda: '' },
            { id: 'c3', client: 'Global Services', value: 20738.80, status: 'ATIVO', responsible: 'João Silva', origem: 'PARCERIA', motivoPerda: '' },
            { id: 'c4', client: 'Mega Corp', value: 20000, status: 'ATIVO', responsible: 'Pedro Lima', origem: 'PROSPECÇÃO', motivoPerda: '' },
            { id: 'c5', client: 'StartUp X', value: 12000, status: 'NAO_INICIADO', responsible: 'Maria Souza', origem: 'CLIENTE', motivoPerda: '' },
            { id: 'c6', client: 'Beta Inc', value: 8000, status: 'NAO_INICIADO', responsible: 'Pedro Lima', origem: 'INDICAÇÃO', motivoPerda: '' },
            { id: 'c7', client: 'Empresa Y', value: 5000, status: 'REUNIAO', responsible: 'João Silva', origem: 'BNI', motivoPerda: '' },
            { id: 'c8', client: 'Corp Z', value: 15000, status: 'ENVIADA', responsible: 'Maria Souza', origem: 'PROSPECÇÃO', motivoPerda: '' },
            { id: 'c9', client: 'Delta Ltd', value: 9000, status: 'PERDIDA', responsible: 'Pedro Lima', origem: 'INDICAÇÃO', motivoPerda: 'PREÇO' },
            { id: 'c10', client: 'Omega SA', value: 7000, status: 'PERDIDA', responsible: 'João Silva', origem: 'PARCERIA', motivoPerda: 'ESCOLHEU CONCORRENTE' }
        ],
        transactions: [
            { id: 't1', desc: 'Mensalidade Assessoria - Alpha', catId: 'r1', type: 'RECEITA', value: 5000, date: '2025-01-10', status: 'PAGO', formaPagamento: 'PIX', tipoPessoa: 'PJ', parcelamento: 1, parcelaAtual: 1, grupoId: null, contaId: 'b1' },
            { id: 't2', desc: 'Honorários Consultoria', catId: 'd1', type: 'DESPESA', value: 1200, date: '2025-01-05', status: 'VENCIDO', formaPagamento: 'TRANSFERÊNCIA', tipoPessoa: 'PF', parcelamento: 1, parcelaAtual: 1, grupoId: null, contaId: 'b2' },
            { id: 't3', desc: 'Vaga Preenchida - Mega Corp', catId: 'r2', type: 'RECEITA', value: 8500, date: '2025-02-20', status: 'PENDENTE', formaPagamento: 'BOLETO', tipoPessoa: 'PJ', parcelamento: 1, parcelaAtual: 1, grupoId: null, contaId: 'b1' },
            { id: 't4', desc: 'Alimentação Equipe', catId: 'd6', type: 'DESPESA', value: 450, date: '2025-01-15', status: 'PAGO', formaPagamento: 'CRÉDITO', tipoPessoa: 'PF', parcelamento: 1, parcelaAtual: 1, grupoId: null, contaId: 'b4' }
        ],
        parcelamentos: [
            { id: 'p1', desc: 'Curso Especialização BNI', catId: 'd4', type: 'DESPESA', valueTotal: 6000, parcelas: 12, formaPagamento: 'CRÉDITO', tipoPessoa: 'PF', dataInicio: '2025-01-10', status: 'ATIVO', contaId: 'b4' }
        ]
    };

    let appData = JSON.parse(localStorage.getItem('gcwData')) || DEFAULT_DATA;
    let currentMonthFilter = new Date().toISOString().slice(0, 7);
    let currentAccountFilter = 'todas';

    function saveData() { localStorage.setItem('gcwData', JSON.stringify(appData)); }
    function formatCurrency(v) { return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v); }
    function formatDate(d) { return new Date(d + 'T00:00:00').toLocaleDateString('pt-BR'); }
    function getMonthName(ym) { const [y, m] = ym.split('-'); const months = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro']; return `${months[parseInt(m)-1]} ${y}`; }

    // Calcular saldo de uma conta bancária
    function calcularSaldoConta(contaId) {
        const conta = appData.bankAccounts.find(b => b.id === contaId);
        if (!conta) return 0;
        
        const transacoesConta = appData.transactions.filter(t => t.contaId === contaId && t.status === 'PAGO');
        const receitas = transacoesConta.filter(t => t.type === 'RECEITA').reduce((s, t) => s + t.value, 0);
        const despesas = transacoesConta.filter(t => t.type === 'DESPESA').reduce((s, t) => s + t.value, 0);
        
        return conta.saldoInicial + receitas - despesas;
    }

    // ==========================================
    // NAVIGATION
    // ==========================================
    function switchPage(pageId, element) {
        document.querySelectorAll('.sidebar-link').forEach(el => { el.classList.remove('active'); el.classList.add('text-slate-300'); });
        if (element) { element.classList.add('active'); element.classList.remove('text-slate-300'); }
        const titles = { 
            'dashboard': 'Dashboard Executivo', 
            'crm': 'Gestão Comercial (CRM)', 
            'financeiro': 'Controle Financeiro', 
            'contas': 'Contas Bancárias',
            'parcelamentos': 'Parcelamentos Longos', 
            'config': 'Configurações do Sistema' 
        };
        document.getElementById('page-title').innerText = titles[pageId];
        renderPage(pageId);
    }

    function renderPage(pageId) {
        const c = document.getElementById('pages-container');
        c.innerHTML = '';
        ({ 'dashboard': renderDashboard, 'crm': renderCRM, 'financeiro': renderFinanceiro, 'contas': renderContas, 'parcelamentos': renderParcelamentos, 'config': renderConfig })[pageId](c);
    }

    // ==========================================
    // DASHBOARD
    // ==========================================
    function renderDashboard(c) {
        const contracts = appData.contracts;
        const transactions = appData.transactions;
        const ativos = contracts.filter(x => x.status === 'ATIVO');
        const naoIniciados = contracts.filter(x => x.status === 'NAO_INICIADO');
        const valorContratado = ativos.reduce((s, x) => s + x.value, 0) + naoIniciados.reduce((s, x) => s + x.value, 0);
        const receitas = transactions.filter(t => t.type === 'RECEITA');
        const despesas = transactions.filter(t => t.type === 'DESPESA');
        const totalReceitas = receitas.reduce((s, t) => s + t.value, 0);
        const totalDespesas = despesas.reduce((s, t) => s + t.value, 0);
        const lucro = totalReceitas - totalDespesas;

        // Saldo total de todas as contas
        const saldoTotalContas = appData.bankAccounts.reduce((s, b) => s + calcularSaldoConta(b.id), 0);

        c.innerHTML = `
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6 fade-in">
                ${kpiCard('Valor Contratado', formatCurrency(valorContratado), 'fa-file-contract', 'bg-blue-500', `${ativos.length} ativos + ${naoIniciados.length} não iniciados`)}
                ${kpiCard('Receita Total', formatCurrency(totalReceitas), 'fa-arrow-trend-up', 'bg-emerald-500', `${receitas.length} transações`)}
                ${kpiCard('Despesas Total', formatCurrency(totalDespesas), 'fa-arrow-trend-down', 'bg-red-500', `${despesas.length} transações`)}
                ${kpiCard('Saldo em Contas', formatCurrency(saldoTotalContas), 'fa-university', saldoTotalContas >= 0 ? 'bg-purple-500' : 'bg-orange-500', `${appData.bankAccounts.length} contas cadastradas`)}
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6 fade-in">
                <div class="lg:col-span-2 bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="text-lg font-semibold text-slate-800 mb-3">Fluxo de Caixa</h3>
                    <canvas id="cashFlowChart" height="100"></canvas>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="text-lg font-semibold text-slate-800 mb-3">Status dos Contratos</h3>
                    <canvas id="contractStatusChart" height="200"></canvas>
                </div>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 fade-in">
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="text-lg font-semibold text-slate-800 mb-3">Próximos Vencimentos</h3>
                    <div class="space-y-2">
                        ${transactions.filter(t => t.status === 'PENDENTE').slice(0, 4).map(t => `
                            <div class="flex justify-between items-center p-3 bg-slate-50 rounded-lg">
                                <div><p class="font-medium text-slate-700 text-sm">${t.desc}</p><p class="text-xs text-slate-500">${formatDate(t.date)}</p></div>
                                <span class="font-bold ${t.type === 'RECEITA' ? 'text-emerald-600' : 'text-red-600'}">${formatCurrency(t.value)}</span>
                            </div>
                        `).join('') || '<p class="text-slate-400 text-sm p-3">Nenhum vencimento pendente.</p>'}
                    </div>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="text-lg font-semibold text-slate-800 mb-3">Resumo da Carteira</h3>
                    <div class="space-y-3">
                        <div class="flex justify-between items-center pb-2 border-b border-slate-100"><span class="text-slate-600">Contratos Ativos</span><span class="font-bold text-slate-800">${ativos.length}</span></div>
                        <div class="flex justify-between items-center pb-2 border-b border-slate-100"><span class="text-slate-600">Em Negociação</span><span class="font-bold text-slate-800">${contracts.filter(x => ['REUNIAO','ENVIADA','AGUARDANDO'].includes(x.status)).length}</span></div>
                        <div class="flex justify-between items-center pb-2 border-b border-slate-100"><span class="text-slate-600">Perdidas</span><span class="font-bold text-slate-800">${contracts.filter(x => x.status === 'PERDIDA').length}</span></div>
                        <div class="flex justify-between items-center"><span class="text-slate-600">Ticket Médio Ativo</span><span class="font-bold text-primary-600">${ativos.length > 0 ? formatCurrency(valorContratado / ativos.length) : 'R$ 0,00'}</span></div>
                    </div>
                </div>
            </div>
        `;
        setTimeout(renderCharts, 100);
    }

    function kpiCard(title, value, icon, bgColor, subtitle) {
        return `<div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 card-hover">
            <div class="flex justify-between items-start">
                <div><p class="text-sm font-medium text-slate-500">${title}</p><p class="text-2xl font-bold text-slate-800 mt-1">${value}</p><p class="text-xs text-slate-400 mt-2">${subtitle}</p></div>
                <div class="p-3 ${bgColor} rounded-lg text-white shadow-sm"><i class="fas ${icon} text-lg"></i></div>
            </div></div>`;
    }

    function renderCharts() {
        const ctx1 = document.getElementById('cashFlowChart');
        if (ctx1) {
            new Chart(ctx1, {
                type: 'bar',
                data: {
                    labels: ['Receitas', 'Despesas', 'Lucro'],
                    datasets: [{
                        label: 'Valores (R$)',
                        data: [
                            appData.transactions.filter(t => t.type === 'RECEITA').reduce((s, t) => s + t.value, 0),
                            appData.transactions.filter(t => t.type === 'DESPESA').reduce((s, t) => s + t.value, 0),
                            appData.transactions.filter(t => t.type === 'RECEITA').reduce((s, t) => s + t.value, 0) - appData.transactions.filter(t => t.type === 'DESPESA').reduce((s, t) => s + t.value, 0)
                        ],
                        backgroundColor: ['#10b981', '#ef4444', '#8b5cf6'],
                        borderRadius: 8, barThickness: 40
                    }]
                },
                options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: '#f1f5f9' } }, x: { grid: { display: false } } } }
            });
        }
        const ctx2 = document.getElementById('contractStatusChart');
        if (ctx2) {
            const statuses = ['ATIVO', 'NAO_INICIADO', 'REUNIAO', 'ENVIADA', 'PERDIDA', 'AGUARDANDO', 'ENCERRADO'];
            const colors = ['#10b981', '#f59e0b', '#3b82f6', '#8b5cf6', '#ef4444', '#64748b', '#94a3b8'];
            const data = statuses.map(s => appData.contracts.filter(c => c.status === s).length);
            new Chart(ctx2, {
                type: 'doughnut',
                data: { labels: ['Ativos', 'Não Iniciados', 'Reunião', 'Enviadas', 'Perdidas', 'Aguardando', 'Encerrados'], datasets: [{ data, backgroundColor: colors, borderWidth: 0, cutout: '70%' }] },
                options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, padding: 10, font: { size: 11 } } } } }
            });
        }
    }

    // ==========================================
    // CRM
    // ==========================================
    function renderCRM(c) {
        const columns = [
            { id: 'AGUARDANDO', title: 'Aguardando Retorno', color: 'gray' },
            { id: 'REUNIAO', title: 'Reuniões Agendadas', color: 'blue' },
            { id: 'ENVIADA', title: 'Propostas Enviadas', color: 'yellow' },
            { id: 'ATIVO', title: 'Contratos Ativos', color: 'green' },
            { id: 'NAO_INICIADO', title: 'Não Iniciados', color: 'orange' },
            { id: 'PERDIDA', title: 'Perdidas', color: 'red' },
            { id: 'ENCERRADO', title: 'Encerrados', color: 'slate' }
        ];

        c.innerHTML = `
            <div class="flex justify-between items-center mb-5 fade-in">
                <div class="flex items-center space-x-2">
                    <span class="text-sm text-slate-500">Total de Contratos:</span>
                    <span class="font-bold text-slate-800">${appData.contracts.length}</span>
                </div>
                <button onclick="openContractModal()" class="bg-primary-600 text-white px-4 py-2 rounded-lg hover:bg-primary-700 transition shadow-sm flex items-center text-sm">
                    <i class="fas fa-plus mr-2"></i> Novo Contrato

    function renderFinanceiro(c) {
        const transactions = appData.transactions;

        const now = new Date();
        const monthOptions = [];
        for (let i = -6; i <= 12; i++) {

                    <div>

                        </div>
                        <div id="motivoPerdaContainer" style="display: ${contract && contract.status === 'PERDIDA' ? 'block' : 'none'};">
                            <label class="block text-sm font-medium text-red-700 mb-1">Motivo da Perda *</label>
                            <select id="c_motivoPerda" class="w-full px-3 py-2 border border-red-300 rounded-lg focus:ring-2 focus:ring-red-500 outline-none">
                                <option value="">Selecione o motivo...</option>
                                ${MOTIVOS_PERDA.map(m => `<option value="${m}" ${contract && contract.motivoPerda === m ? 'selected' : ''}>${m}</option>`).join('')}

    function toggleMotivoPerda() {

    function openTransactionModal(id = null) {
        const trans = id ? appData.transactions.find(t => t.id === id) : null;
        const allCats = [
            ...appData.categories.receitas.map(c => ({ ...c, type: 'RECEITA' })),

        ];

                    <h3 class="text-xl font-bold text-slate-800">${trans ? 'Editar' : 'Nova'} Transação</h3>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times text-xl"></i></button>
                </div>
                <form id="transForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Descrição *</label>
                        <input type="text" id="t_desc" value="${trans ? trans.desc : ''}" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none" required>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Valor (R$) *</label>
                            <input type="number" step="0.01" id="t_value" value="${trans ? trans.value : ''}" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Vencimento *</label>
                            <input type="date" id="t_date" value="${trans ? trans.date : new Date().toISOString().split('T')[0]}" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none" required>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Categoria *</label>
                            <select id="t_cat" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none">
                                ${allCats.map(c => `<option value="${c.id}" ${trans && trans.catId === c.id ? 'selected' : ''}>${c.nome} (${c.type})</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Status *</label>
                            <select id="t_status" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none">
                                ${STATUS_TRANS.map(s => `<option value="${s}" ${trans && trans.status === s ? 'selected' : ''}>${s}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Forma de Pagamento</label>
                            <select id="t_forma" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none">
                                ${FORMAS_PAGAMENTO.map(f => `<option value="${f}" ${trans && trans.formaPagamento === f ? 'selected' : ''}>${f}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Tipo Pessoa</label>
                            <select id="t_tipoPessoa" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none">
                                ${TIPOS_PESSOA.map(t => `<option value="${t}" ${trans && trans.tipoPessoa === t ? 'selected' : ''}>${t}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Nº Parcelas</label>
                            <input type="number" id="t_parcelas" min="1" max="48" value="${trans ? trans.parcelamento : 1}" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none">
                            <p class="text-xs text-slate-400 mt-1">1 = pagamento único</p>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Conta Bancária *</label>
                        <select id="t_conta" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none">
                            <option value="">Selecione a conta...</option>
                            ${appData.bankAccounts.map(b => `<option value="${b.id}" ${trans && trans.contaId === b.id ? 'selected' : ''}>${b.nome} (${b.tipoPessoa})</option>`).join('')}
                        </select>
                        <p class="text-xs text-slate-400 mt-1">Vincule a transação a uma conta bancária específica</p>
                    </div>
                    <div id="installmentPreview" class="hidden bg-purple-50 border border-purple-200 rounded-lg p-3">
                        <p class="text-sm font-semibold text-purple-800"><i class="fas fa-info-circle mr-1"></i>Preview do Parcelamento</p>
                        <p class="text-xs text-purple-700 mt-1" id="installmentPreviewText"></p>
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 text-white py-2.5 rounded-lg hover:bg-emerald-700 transition font-medium mt-4">Salvar Transação</button>
                </form>
            </div>
        `;
        openModal();

        const updatePreview = () => {
            const val = parseFloat(document.getElementById('t_value').value) || 0;
            const parc = parseInt(document.getElementById('t_parcelas').value) || 1;
            const preview = document.getElementById('installmentPreview');
            const previewText = document.getElementById('installmentPreviewText');
            if (parc > 1 && val > 0) {
                preview.classList.remove('hidden');
                previewText.innerHTML = `Serão geradas <strong>${parc} parcelas</strong> de <strong>${formatCurrency(val / parc)}</strong> cada, totalizando <strong>${formatCurrency(val)}</strong>.`;
            } else { preview.classList.add('hidden'); }
        };
        document.getElementById('t_value').addEventListener('input', updatePreview);
        document.getElementById('t_parcelas').addEventListener('input', updatePreview);
        updatePreview();

        document.getElementById('transForm').onsubmit = (e) => {
            e.preventDefault();
            const selectedCat = allCats.find(c => c.id === document.getElementById('t_cat').value);
            const parcelas = parseInt(document.getElementById('t_parcelas').value) || 1;
            const valorTotal = parseFloat(document.getElementById('t_value').value);
            const valorParcela = valorTotal / parcelas;
            const baseDate = document.getElementById('t_date').value;
            const contaId = document.getElementById('t_conta').value;
            const grupoId = 'g' + Date.now();

            const data = {
                desc: document.getElementById('t_desc').value,
                catId: selectedCat.id,
                type: selectedCat.type,
                status: document.getElementById('t_status').value,
                formaPagamento: document.getElementById('t_forma').value,
                tipoPessoa: document.getElementById('t_tipoPessoa').value,
                parcelamento: parcelas,
                contaId: contaId || null,
                grupoId: parcelas > 1 ? grupoId : null
            };

            if (trans) {
                if (trans.grupoId) {
                    appData.transactions = appData.transactions.filter(t => t.grupoId !== trans.grupoId || t.id === trans.id);
                }
                if (parcelas > 1) {
                    for (let i = 0; i < parcelas; i++) {
                        const d = new Date(baseDate + 'T00:00:00');
                        d.setMonth(d.getMonth() + i);
                        const installmentData = {
                            ...data,
                            id: i === 0 ? trans.id : 't' + Date.now() + '_' + i,
                            value: valorParcela,
                            date: d.toISOString().split('T')[0],
                            parcelaAtual: i + 1,
                            grupoId: grupoId
                        };
                        if (i === 0) { Object.assign(trans, installmentData); }
                        else { appData.transactions.push(installmentData); }
                    }
                } else {
                    Object.assign(trans, { ...data, value: valorTotal, date: baseDate, parcelaAtual: 1, grupoId: null });
                }
            } else {
                for (let i = 0; i < parcelas; i++) {
                    const d = new Date(baseDate + 'T00:00:00');
                    d.setMonth(d.getMonth() + i);
                    appData.transactions.push({
                        id: 't' + Date.now() + '_' + i,
                        desc: document.getElementById('t_desc').value,
                        catId: selectedCat.id,
                        type: selectedCat.type,
                        value: valorParcela,
                        date: d.toISOString().split('T')[0],
                        status: document.getElementById('t_status').value,
                        formaPagamento: document.getElementById('t_forma').value,
                        tipoPessoa: document.getElementById('t_tipoPessoa').value,
                        parcelamento: parcelas,
                        parcelaAtual: i + 1,
                        contaId: contaId || null,
                        grupoId: parcelas > 1 ? grupoId : null
                    });
                }
            }
            saveData(); closeModal(); renderPage('financeiro');
        };
    }

                            <label class="block text-sm font-medium text-slate-700 mb-1">Categoria *</label>
                            <select id="i_cat" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none">
                                ${allCats.map(c => `<option value="${c.id}" ${inst && inst.catId === c.id ? 'selected' : ''}>${c.nome} (${c.type})</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Data da 1ª Parcela *</label>
                            <input type="date" id="i_dataInicio" value="${inst ? inst.dataInicio : new Date().toISOString().split('T')[0]}" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none" required>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Forma de Pagamento</label>
                            <select id="i_forma" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none">
                                ${FORMAS_PAGAMENTO.map(f => `<option value="${f}" ${inst && inst.formaPagamento === f ? 'selected' : ''}>${f}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Tipo Pessoa</label>
                            <select id="i_tipoPessoa" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none">
                                ${TIPOS_PESSOA.map(t => `<option value="${t}" ${inst && inst.tipoPessoa === t ? 'selected' : ''}>${t} - ${t === 'PF' ? 'Pessoa Física' : 'Pessoa Jurídica'}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Conta Bancária *</label>
                        <select id="i_conta" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none">
                            <option value="">Selecione a conta...</option>
                            ${appData.bankAccounts.map(b => `<option value="${b.id}" ${inst && inst.contaId === b.id ? 'selected' : ''}>${b.nome} (${b.tipoPessoa})</option>`).join('')}
                        </select>
                    </div>
                    <div class="bg-purple-50 border border-purple-200 rounded-lg p-3">
                        <p class="text-sm font-semibold text-purple-800"><i class="fas fa-info-circle mr-1"></i>Resumo</p>
                        <p class="text-xs text-purple-700 mt-1">Ao salvar, o sistema gerará automaticamente as parcelas mensais no módulo Financeiro.</p>
                    </div>
                    <button type="submit" class="w-full bg-purple-600 text-white py-2.5 rounded-lg hover:bg-purple-700 transition font-medium mt-4">Salvar Parcelamento</button>
                </form>
            </div>
        `;
        openModal();

        document.getElementById('instForm').onsubmit = (e) => {
            e.preventDefault();
            const selectedCat = allCats.find(c => c.id === document.getElementById('i_cat').value);
            const data = {
                desc: document.getElementById('i_desc').value,
                catId: selectedCat.id,
                type: selectedCat.type,
                valueTotal: parseFloat(document.getElementById('i_value').value),
                parcelas: parseInt(document.getElementById('i_parcelas').value),
                dataInicio: document.getElementById('i_dataInicio').value,
                formaPagamento: document.getElementById('i_forma').value,
                tipoPessoa: document.getElementById('i_tipoPessoa').value,
                contaId: document.getElementById('i_conta').value,
                status: 'ATIVO'
            };

            if (inst) { Object.assign(inst, data); }
            else { appData.parcelamentos.push({ id: 'p' + Date.now(), ...data }); }

            const grupoId = 'pg' + Date.now();
            const valorParcela = data.valueTotal / data.parcelas;
            for (let i = 0; i < data.parcelas; i++) {
                const d = new Date(data.dataInicio + 'T00:00:00');
                d.setMonth(d.getMonth() + i);
                appData.transactions.push({
                    id: 'pt' + Date.now() + '_' + i,
                    desc: `${data.desc} (${i + 1}/${data.parcelas})`,
                    catId: data.catId,
                    type: data.type,
                    value: valorParcela,
                    date: d.toISOString().split('T')[0],
                    status: 'PENDENTE',
                    formaPagamento: data.formaPagamento,
                    tipoPessoa: data.tipoPessoa,
                    parcelamento: data.parcelas,
                    parcelaAtual: i + 1,
                    contaId: data.contaId,
                    grupoId: grupoId
                });
            }

            saveData(); closeModal(); renderPage('parcelamentos');
        };
    }

    // --- CATEGORY MODAL ---
    function openCategoryModal(tipo) {
        document.getElementById('modal-content').innerHTML = `
            <div class="p-6">
                <div class="flex justify-between items-center mb-5">
                    <h3 class="text-xl font-bold text-slate-800">Nova Categoria de ${tipo === 'receita' ? 'Receita' : 'Despesa'}</h3>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times text-xl"></i></button>
                </div>
                <form id="catForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Nome da Categoria *</label>
                        <input type="text" id="cat_nome" placeholder="Ex: Receita- Consultoria" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Tipo</label>
                        <select id="cat_tipo" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none">
                            <option value="Recorrente">Recorrente</option>
                            <option value="Pontual">Pontual</option>
                            <option value="Variável">Variável</option>
                            <option value="Fixo">Fixo</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-primary-600 text-white py-2.5 rounded-lg hover:bg-primary-700 transition font-medium mt-4">Adicionar Categoria</button>
                </form>
            </div>
        `;
        openModal();

        document.getElementById('catForm').onsubmit = (e) => {
            e.preventDefault();
            const newCat = {
                id: (tipo === 'receita' ? 'r' : 'd') + Date.now(),
                nome: document.getElementById('cat_nome').value,
                tipo: document.getElementById('cat_tipo').value
            };
            if (tipo === 'receita') { appData.categories.receitas.push(newCat); }
            else { appData.categories.despesas.push(newCat); }
            saveData(); closeModal(); renderPage('config');
        };
    }

    // ==========================================
    // DELETE FUNCTIONS
    // ==========================================
    function deleteContract(id) {
        if (confirm('Tem certeza que deseja excluir este contrato?')) {
            appData.contracts = appData.contracts.filter(c => c.id !== id);
            saveData(); renderPage('crm');
        }
    }
    function deleteTransaction(id) {
        if (confirm('Tem certeza que deseja excluir esta transação?')) {
            const trans = appData.transactions.find(t => t.id === id);
            if (trans && trans.grupoId) {
                if (confirm('Esta transação faz parte de um parcelamento. Deseja excluir TODAS as parcelas?')) {
                    appData.transactions = appData.transactions.filter(t => t.grupoId !== trans.grupoId);
                } else {
                    appData.transactions = appData.transactions.filter(t => t.id !== id);
                }
            } else {
                appData.transactions = appData.transactions.filter(t => t.id !== id);
            }
            saveData(); renderPage('financeiro');
        }
    }
    function deleteInstallment(id) {
        if (confirm('Tem certeza que deseja excluir este parcelamento e todas as suas parcelas?')) {
            const inst = appData.parcelamentos.find(p => p.id === id);
            if (inst) {
                const relatedTrans = appData.transactions.filter(t => t.desc.startsWith(inst.desc));
                relatedTrans.forEach(t => {
                    appData.transactions = appData.transactions.filter(x => x.id !== t.id);
                });
            }
            appData.parcelamentos = appData.parcelamentos.filter(p => p.id !== id);
            saveData(); renderPage('parcelamentos');
        }
    }
    function deleteBankAccount(id) {
        const transacoesVinculadas = appData.transactions.filter(t => t.contaId === id).length;
        if (transacoesVinculadas > 0) {
            if (!confirm(`Esta conta possui ${transacoesVinculadas} transações vinculadas. Deseja excluir mesmo assim? As transações ficarão sem conta vinculada.`)) {
                return;
            }
        }
        if (confirm('Tem certeza que deseja excluir esta conta bancária?')) {
            appData.bankAccounts = appData.bankAccounts.filter(b => b.id !== id);
            // Remove vínculo das transações
            appData.transactions.forEach(t => {
                if (t.contaId === id) t.contaId = null;
            });
            saveData(); renderPage('contas');
        }
    }
    function deleteCategory(tipo, id) {
        if (confirm('Tem certeza que deseja excluir esta categoria?')) {
            if (tipo === 'receita') { appData.categories.receitas = appData.categories.receitas.filter(c => c.id !== id); }
            else { appData.categories.despesas = appData.categories.despesas.filter(c => c.id !== id); }
            saveData(); renderPage('config');
        }
    }

    // ==========================================
    // INIT
    // ==========================================
    document.addEventListener('DOMContentLoaded', () => { renderPage('dashboard'); });
    </script>
</body>
