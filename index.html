    function setNotificationRead(notificationId, read = true) {
        if (!notificationId) return;
        const existingIndex = appNotifications.findIndex(n => n.id === notificationId);
        if (existingIndex >= 0) {
            appNotifications[existingIndex].read = read;
        } else {
            appNotifications.push({ id: notificationId, read });

    async function saveData() {
        // Sempre salva no localStorage como backup
        localStorage.setItem('gcwData', JSON.stringify(appData));
        
        // Se o Supabase estiver conectado, sincroniza com a nuvem
        if (supabaseClient && dbConnected) {
            try {
                // Sincroniza cada tabela em paralelo
                await Promise.all([
                    // Categories (receitas e despesas juntas, com campo para diferenciar)
                    supabaseClient.from('categories').upsert(
                        [
                            ...appData.categories.receitas.map(c => ({...c, categoria_tipo: 'receita'})),
                            ...appData.categories.despesas.map(c => ({...c, categoria_tipo: 'despesa'}))
                        ],
                        { onConflict: 'id' }
                    ),
                    // Bank Accounts
                    supabaseClient.from('bank_accounts').upsert(
                        appData.bankAccounts.map(b => ({

                            saldo_inicial: b.saldoInicial, cor: b.cor, icone: b.icone
                        })),
                        { onConflict: 'id' }
                    ),
                    // Contracts
                    supabaseClient.from('contracts').upsert(
                        appData.contracts.map(c => ({

                            responsible: c.responsible, origem: c.origem, motivo_perda: c.motivoPerda,
                            descricao: c.descricao
                        })),
                        { onConflict: 'id' }
                    ),
                    // Vacancies
                    supabaseClient.from('vacancies').upsert(
                        appData.vacancies.map(v => ({
                            id: v.id, cliente: v.cliente, cargo: v.cargo, responsavel: v.responsavel || null,
                            abertura: v.abertura, limite: v.limite, fechamento: v.fechamento, tempo: v.tempo,
                            status: v.status, faturamento: v.faturamento, percentual: v.percentual, data: v.data,
                            inicio_garantia: v.inicioGarantia, fim_garantia: v.fimGarantia, reposicao: v.reposicao
                        })),
                        { onConflict: 'id' }
                    ),
                    // Transactions
                    supabaseClient.from('transactions').upsert(
                        appData.transactions.map(t => ({
                            id: t.id, descricao: t.desc, cat_id: t.catId, type: t.type, value: t.value,
                            date: t.date, status: t.status, forma_pagamento: t.formaPagamento,
                            tipo_pessoa: t.tipoPessoa, parcelamento: t.parcelamento,
                            parcela_atual: t.parcelaAtual, grupo_id: t.grupoId, conta_id: t.contaId
                        })),
                        { onConflict: 'id' }
                    ),
                    // Parcelamentos
                    supabaseClient.from('parcelamentos').upsert(
                        appData.parcelamentos.map(p => ({
                            id: p.id, descricao: p.desc, cat_id: p.catId, type: p.type,
                            value_total: p.valueTotal, parcelas: p.parcelas, data_inicio: p.dataInicio,
                            forma_pagamento: p.formaPagamento, tipo_pessoa: p.tipoPessoa,
                            conta_id: p.contaId, status: p.status
                        })),
                        { onConflict: 'id' }
                    ),
                    // Users
                    supabaseClient.from('users').upsert(
                        appData.users.map(u => ({
                            id: u.id, email: u.email, password: u.password, nome: u.nome,
                            role: u.role, permissions: u.permissions, created_at: u.createdAt,
                            last_login: u.lastLogin
                        })),
                        { onConflict: 'id' }
                    )
                ]);
                console.log('✅ Dados sincronizados com Supabase');
            } catch (error) {
                console.error('⚠️ Erro ao sincronizar com Supabase:', error);
            }
        }
    }

    async function loadData() {
        // Tenta carregar do Supabase primeiro
        if (supabaseClient) {
            try {
                // Testa a conexão com uma query simples
                const { data: testData, error } = await supabaseClient.from('categories').select('id').limit(1);
                if (error) throw error;
                
                dbConnected = true;
                updateDbStatus(true);
                console.log('✅ Conectado ao Supabase');

                // Carrega todas as tabelas em paralelo
                const [cats, banks, contracts, vacancies, transactions, parcelamentos, users] = await Promise.all([
                    supabaseClient.from('categories').select('*'),
                    supabaseClient.from('bank_accounts').select('*'),
                    supabaseClient.from('contracts').select('*'),
                    supabaseClient.from('vacancies').select('*'),
                    supabaseClient.from('transactions').select('*'),
                    supabaseClient.from('parcelamentos').select('*'),
                    supabaseClient.from('users').select('*')
                ]);

                // Converte os dados do Supabase para o formato do appData
                if (cats.data && cats.data.length > 0) {
                    appData.categories.receitas = cats.data.filter(c => c.categoria_tipo === 'receita').map(c => ({
                        id: c.id, nome: c.nome, tipo: c.tipo
                    }));
                    appData.categories.despesas = cats.data.filter(c => c.categoria_tipo === 'despesa').map(c => ({
                        id: c.id, nome: c.nome, tipo: c.tipo
                    }));
                }
                if (banks.data && banks.data.length > 0) {
                    appData.bankAccounts = banks.data.map(b => ({
                        id: b.id, nome: b.nome, tipo: b.tipo, tipoPessoa: b.tipo_pessoa,
                        saldoInicial: b.saldo_inicial, cor: b.cor, icone: b.icone
                    }));
                }
                if (contracts.data && contracts.data.length > 0) {
                    appData.contracts = contracts.data.map(c => ({
                        id: c.id, client: c.client, value: c.value, status: c.status,
                        responsible: c.responsible, origem: c.origem, motivoPerda: c.motivo_perda,
                        descricao: c.descricao
                    }));
                }
                if (vacancies.data && vacancies.data.length > 0) {
                    appData.vacancies = vacancies.data.map(v => ({
                        id: v.id, cliente: v.cliente, cargo: v.cargo, responsavel: v.responsavel || null,
                        abertura: v.abertura, limite: v.limite, fechamento: v.fechamento, tempo: v.tempo,
                        status: v.status, faturamento: v.faturamento, percentual: v.percentual, data: v.data,
                        inicioGarantia: v.inicio_garantia, fimGarantia: v.fim_garantia, reposicao: v.reposicao
                    }));
                }
                if (transactions.data && transactions.data.length > 0) {
                    appData.transactions = transactions.data.map(t => ({
                        id: t.id, desc: t.descricao, catId: t.cat_id, type: t.type, value: t.value,
                        date: t.date, status: t.status, formaPagamento: t.forma_pagamento,
                        tipoPessoa: t.tipo_pessoa, parcelamento: t.parcelamento,
                        parcelaAtual: t.parcela_atual, grupoId: t.grupo_id, contaId: t.conta_id
                    }));
                }
                if (parcelamentos.data && parcelamentos.data.length > 0) {
                    appData.parcelamentos = parcelamentos.data.map(p => ({
                        id: p.id, desc: p.descricao, catId: p.cat_id, type: p.type,
                        valueTotal: p.value_total, parcelas: p.parcelas, dataInicio: p.data_inicio,
                        formaPagamento: p.forma_pagamento, tipoPessoa: p.tipo_pessoa,
                        contaId: p.conta_id, status: p.status
                    }));
                }
                if (users.data && users.data.length > 0) {
                    appData.users = users.data.map(u => ({
                        id: u.id, email: u.email, password: u.password, nome: u.nome,
                        role: u.role, permissions: u.permissions || [],
                        createdAt: u.created_at ? u.created_at.split('T')[0] : null,
                        lastLogin: u.last_login
                    }));
                }
            } catch (error) {
                console.error('⚠️ Erro ao conectar com Supabase, usando localStorage:', error);
                dbConnected = false;
                updateDbStatus(false);
                // Fallback para localStorage
                const saved = localStorage.getItem('gcwData');
                if (saved) appData = JSON.parse(saved);
            }
        } else {
            dbConnected = false;
            updateDbStatus(false);
            const saved = localStorage.getItem('gcwData');
            if (saved) appData = JSON.parse(saved);
        }
    }

    function updateDbStatus(online) {
        const indicator = document.getElementById('db-status-indicator');
        const statusText = document.getElementById('db-status-text');
        if (online) {
            if (indicator) indicator.innerHTML = '<span class="db-status db-online"></span><span class="text-green-600 font-medium">Conectado ao banco de dados</span>';
            if (statusText) statusText.innerHTML = '<span class="db-status db-online"></span><span class="text-green-400">Online</span>';
        } else {
            if (indicator) indicator.innerHTML = '<span class="db-status db-offline"></span><span class="text-slate-500">Modo offline (localStorage)</span>';
            if (statusText) statusText.innerHTML = '<span class="db-status db-offline"></span><span class="text-red-400">Offline</span>';
        }
    }

    function formatCurrency(v) { return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v || 0); }
    function formatDate(d) { return d ? new Date(d + 'T00:00:00').toLocaleDateString('pt-BR') : '-'; }
    function getMonthName(ym) { const [y, m] = ym.split('-'); const months = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro']; return `${months[parseInt(m)-1]} ${y}`; }
    function calcularDias(data1, data2) {
        if (!data1 || !data2) return null;
        const d1 = new Date(data1 + 'T00:00:00');
        const d2 = new Date(data2 + 'T00:00:00');
        return Math.ceil((d2 - d1) / (1000 * 60 * 60 * 24));
    }

    function calcularSaldoConta(contaId) {
        const conta = appData.bankAccounts.find(b => b.id === contaId);
        if (!conta) return 0;
        const transacoesConta = appData.transactions.filter(t => t.contaId === contaId && t.status === 'PAGO');
        const receitas = transacoesConta.filter(t => t.type === 'RECEITA').reduce((s, t) => s + t.value, 0);
        const despesas = transacoesConta.filter(t => t.type === 'DESPESA').reduce((s, t) => s + t.value, 0);
        return conta.saldoInicial + receitas - despesas;
    }

    // ==========================================
    // NOTIFICAÇÕES
    // ==========================================
    function generateNotifications() {
        const notifications = [];
        const today = new Date(); today.setHours(0, 0, 0, 0);
        const threeDaysFromNow = new Date(today); threeDaysFromNow.setDate(today.getDate() + 3);

        if (hasPermission('financeiro')) {
            appData.transactions.filter(t => t.status === 'VENCIDO').forEach(t => {
                const cat = [...appData.categories.receitas, ...appData.categories.despesas].find(c => c.id === t.catId);
                notifications.push({ id: 'n_venc_' + t.id, type: 'URGENTE', icon: 'fa-exclamation-circle', color: 'red', title: 'Conta Vencida!', message: `${t.desc} - ${formatCurrency(t.value)} venceu em ${formatDate(t.date)}`, category: cat ? cat.nome : 'N/A', date: new Date().toISOString(), read: getNotificationReadState('n_venc_' + t.id), action: { type: 'financeiro', id: t.id, scrollTo: t.id } });
            });

            appData.transactions.filter(t => {
                if (t.status !== 'PENDENTE') return false;
                const dueDate = new Date(t.date + 'T00:00:00');
                return dueDate >= today && dueDate <= threeDaysFromNow;
            }).forEach(t => {
                const cat = [...appData.categories.receitas, ...appData.categories.despesas].find(c => c.id === t.catId);
                const dueDate = new Date(t.date + 'T00:00:00');
                const daysLeft = Math.ceil((dueDate - today) / (1000 * 60 * 60 * 24));
                notifications.push({ id: 'n_prox_' + t.id, type: 'AVISO', icon: 'fa-clock', color: 'yellow', title: daysLeft === 0 ? 'Vence Hoje!' : `Vence em ${daysLeft} dia(s)`, message: `${t.desc} - ${formatCurrency(t.value)} ${t.type === 'RECEITA' ? 'a receber' : 'a pagar'}`, category: cat ? cat.nome : 'N/A', date: new Date().toISOString(), read: getNotificationReadState('n_prox_' + t.id), action: { type: 'financeiro', id: t.id, scrollTo: t.id } });
            });

            appData.transactions.filter(t => t.type === 'RECEITA' && t.status === 'PAGO').slice(0, 3).forEach(t => {
                notifications.push({ id: 'n_rec_' + t.id, type: 'SUCESSO', icon: 'fa-check-circle', color: 'green', title: 'Receita Confirmada!', message: `${t.desc} - ${formatCurrency(t.value)} recebido`, category: 'Receita', date: new Date().toISOString(), read: getNotificationReadState('n_rec_' + t.id), action: { type: 'financeiro', id: t.id, scrollTo: t.id } });
            });
        }

        if (hasPermission('crm')) {
            appData.contracts.filter(c => ['ENVIADA', 'REUNIAO', 'EM_ELABORACAO'].includes(c.status)).forEach(c => {
                let statusText = 'Em Negociação';
                if (c.status === 'ENVIADA') statusText = 'Proposta Enviada';
                else if (c.status === 'REUNIAO') statusText = 'Reunião Agendada';
                else if (c.status === 'EM_ELABORACAO') statusText = 'Proposta em Elaboração';
                notifications.push({ id: 'n_neg_' + c.id, type: 'INFO', icon: 'fa-handshake', color: 'blue', title: statusText, message: `${c.client} - ${formatCurrency(c.value)}`, category: 'CRM', date: new Date().toISOString(), read: getNotificationReadState('n_neg_' + c.id), action: { type: 'crm', id: c.id, scrollTo: c.id } });
            });

            appData.contracts.filter(c => c.status === 'PERDIDA').slice(0, 2).forEach(c => {
                notifications.push({ id: 'n_perd_' + c.id, type: 'AVISO', icon: 'fa-times-circle', color: 'red', title: 'Contrato Perdido', message: `${c.client} - ${formatCurrency(c.value)} | Motivo: ${c.motivoPerda || 'Não informado'}`, category: 'CRM', date: new Date().toISOString(), read: getNotificationReadState('n_perd_' + c.id), action: { type: 'crm', id: c.id, scrollTo: c.id } });
            });
        }

        if (hasPermission('vagas')) {
            appData.vacancies.filter(v => {
                if (v.status !== 'ABERTO' || !v.limite) return false;
                const limiteDate = new Date(v.limite + 'T00:00:00');
                return limiteDate >= today && limiteDate <= threeDaysFromNow;
            }).forEach(v => {
                const limiteDate = new Date(v.limite + 'T00:00:00');
                const daysLeft = Math.ceil((limiteDate - today) / (1000 * 60 * 60 * 24));
                notifications.push({ id: 'n_vaga_' + v.id, type: 'AVISO', icon: 'fa-briefcase', color: 'yellow', title: daysLeft === 0 ? 'Vaga vence hoje!' : `Vaga vence em ${daysLeft} dia(s)`, message: `${v.cliente} - ${v.cargo}${v.responsavel ? ` | Responsável: ${v.responsavel}` : ''}`, category: 'Vagas', date: new Date().toISOString(), read: getNotificationReadState('n_vaga_' + v.id), action: { type: 'vagas', id: v.id, scrollTo: v.id } });
            });
        }

        if (hasPermission('contas')) {
            appData.bankAccounts.forEach(b => {
                const saldo = calcularSaldoConta(b.id);
                if (saldo < 1000 && saldo >= 0) {
                    notifications.push({ id: 'n_saldo_' + b.id, type: 'AVISO', icon: 'fa-wallet', color: 'yellow', title: 'Saldo Baixo', message: `${b.nome} está com ${formatCurrency(saldo)}`, category: 'Contas Bancárias', date: new Date().toISOString(), read: getNotificationReadState('n_saldo_' + b.id), action: { type: 'contas', id: b.id, scrollTo: b.id } });
                } else if (saldo < 0) {
                    notifications.push({ id: 'n_saldo_neg_' + b.id, type: 'URGENTE', icon: 'fa-exclamation-triangle', color: 'red', title: 'Saldo Negativo!', message: `${b.nome} está com ${formatCurrency(saldo)}`, category: 'Contas Bancárias', date: new Date().toISOString(), read: getNotificationReadState('n_saldo_neg_' + b.id), action: { type: 'contas', id: b.id, scrollTo: b.id } });
                }
            });
        }

        const urgencyOrder = { 'URGENTE': 0, 'AVISO': 1, 'SUCESSO': 2, 'INFO': 3 };
        notifications.sort((a, b) => urgencyOrder[a.type] - urgencyOrder[b.type]);
        return notifications.slice(0, 20);
    }

    function updateNotificationBadge() {
        const badge = document.getElementById('notification-badge');
        if (!badge) return;
        const notifications = generateNotifications();
        const unreadCount = notifications.filter(n => !n.read).length;
        badge.innerText = unreadCount;
        badge.style.display = unreadCount > 0 ? 'flex' : 'none';
    }

    function toggleNotifications() {
        const dropdown = document.getElementById('notification-dropdown');
        if (!dropdown) return;
        dropdown.classList.toggle('hidden');
        if (!dropdown.classList.contains('hidden')) renderNotifications();
    }

    function renderNotifications() {
        const list = document.getElementById('notification-list');
        if (!list) return;
        const notifications = generateNotifications();
        if (notifications.length === 0) {
            list.innerHTML = `<div class="p-8 text-center"><i class="fas fa-bell-slash text-4xl text-slate-300 mb-3"></i><p class="text-slate-500">Nenhuma notificação</p></div>`;
            return;
        }
        list.innerHTML = notifications.map(n => {
            const colorClasses = { 'red': 'bg-red-100 text-red-600', 'yellow': 'bg-yellow-100 text-yellow-600', 'green': 'bg-green-100 text-green-600', 'blue': 'bg-blue-100 text-blue-600', 'purple': 'bg-purple-100 text-purple-600' };
            const typeLabels = { 'URGENTE': 'Urgente', 'AVISO': 'Aviso', 'SUCESSO': 'Sucesso', 'INFO': 'Info' };
            return `<div class="notification-item p-4 border-b border-slate-100 ${n.read ? 'read' : 'unread'} cursor-pointer hover:bg-slate-50 transition" onclick="handleNotificationClick('${n.action.type}', '${n.action.id}', '${n.id}', '${n.action.scrollTo || ''}')">
                <div class="flex items-start space-x-3">
                    <div class="flex-shrink-0 w-10 h-10 rounded-full ${colorClasses[n.color]} flex items-center justify-center"><i class="fas ${n.icon}"></i></div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-start">
                            <p class="text-sm font-semibold text-slate-800">${n.title}</p>
                            <span class="tag tag-${n.color} text-[10px]">${typeLabels[n.type]}</span>
                        </div>
                        <p class="text-xs text-slate-600 mt-1">${n.message}</p>
                        <p class="text-[10px] text-slate-400 mt-1"><i class="fas fa-arrow-right mr-1"></i>Clique para abrir</p>
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    function handleNotificationClick(pageType, id, notificationId, scrollToId) {
        if (!hasPermission(pageType)) {
            alert('Você não tem permissão para acessar este módulo.');
            return;
        }

        if (notificationId) {
            setNotificationRead(notificationId, true);
        }

        const pageElement = document.querySelector(`[onclick="switchPage('${pageType}', this)"]`);
        switchPage(pageType, pageElement);
        const dropdown = document.getElementById('notification-dropdown');
        if (dropdown) dropdown.classList.add('hidden');
        updateNotificationBadge();
        setTimeout(() => {
            if (scrollToId) {
                const element = document.getElementById(`item-${scrollToId}`);
                if (element) {
                    element.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    element.classList.add('highlight-row');
                    setTimeout(() => element.classList.remove('highlight-row'), 2000);
                }
            }
        }, 300);
    }

    function markAllAsRead() {
        const notifications = generateNotifications();
        notifications.forEach(n => setNotificationRead(n.id, true));
        updateNotificationBadge();
        renderNotifications();
        alert('Todas as notificações marcadas como lidas!');
    }

    function clearAllNotifications() {
        if (confirm('Deseja limpar TODAS as notificações?')) {
            saveNotifications([]);
            const dropdown = document.getElementById('notification-dropdown');
            if (dropdown) dropdown.classList.add('hidden');
            updateNotificationBadge();
            renderNotifications();
        }
    }

    document.addEventListener('click', (e) => {
        const dropdown = document.getElementById('notification-dropdown');
        if (!dropdown) return;
        const bell = e.target.closest('button[onclick="toggleNotifications()"]');
        if (!bell && !dropdown.contains(e.target)) dropdown.classList.add('hidden');
    });

    // ==========================================
    // NAVEGAÇÃO
    // ==========================================
    function switchPage(pageId, element) {
        if (!hasPermission(pageId)) {
            alert('Você não tem permissão para acessar este módulo.');
            return;
        }
        document.querySelectorAll('.sidebar-link').forEach(el => { el.classList.remove('active'); el.classList.add('text-slate-300'); });
        if (element) { element.classList.add('active'); element.classList.remove('text-slate-300'); }
        const titles = { 'dashboard': 'Dashboard Executivo', 'crm': 'Gestão Comercial (CRM)', 'vagas': 'Controle de Vagas', 'financeiro': 'Controle Financeiro', 'contas': 'Contas Bancárias', 'parcelamentos': 'Parcelamentos Longos', 'config': 'Configurações do Sistema', 'usuarios': 'Gerenciamento de Usuários' };
        document.getElementById('page-title').innerText = titles[pageId] || 'Sistema';
        renderPage(pageId);
    }

    function renderPage(pageId) {
        if (!hasPermission(pageId)) {
            document.getElementById('pages-container').innerHTML = '<div class="p-8 text-center text-slate-500 fade-in"><i class="fas fa-lock text-6xl text-slate-300 mb-4"></i><h3 class="text-xl font-semibold text-slate-700 mb-2">Acesso Negado</h3><p class="text-slate-500">Você não tem permissão para acessar este módulo.</p></div>';
            return;
        }
        const c = document.getElementById('pages-container');

    // ==========================================
    // DASHBOARD
    // ==========================================
    function renderDashboard(c) {
        const contracts = appData.contracts;
        const transactions = appData.transactions;
        const vacancies = appData.vacancies;
        const ativos = contracts.filter(x => x.status === 'ATIVO');
        const naoIniciados = contracts.filter(x => x.status === 'NAO_INICIADO');
        const valorContratado = ativos.reduce((s, x) => s + x.value, 0) + naoIniciados.reduce((s, x) => s + x.value, 0);
        const receitas = transactions.filter(t => t.type === 'RECEITA');
        const despesas = transactions.filter(t => t.type === 'DESPESA');
        const totalReceitas = receitas.reduce((s, t) => s + t.value, 0);
        const totalDespesas = despesas.reduce((s, t) => s + t.value, 0);
        const saldoTotalContas = appData.bankAccounts.reduce((s, b) => s + calcularSaldoConta(b.id), 0);
        const vagasAbertas = vacancies.filter(v => v.status === 'ABERTO').length;
        const vagasFechadas = vacancies.filter(v => v.status === 'FECHADO').length;

        c.innerHTML = `
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6 fade-in">
                ${hasPermission('crm') ? kpiCard('Valor Contratado', formatCurrency(valorContratado), 'fa-file-contract', 'bg-blue-500', `${ativos.length} ativos + ${naoIniciados.length} não iniciados`) : ''}
                ${hasPermission('financeiro') ? kpiCard('Receita Total', formatCurrency(totalReceitas), 'fa-arrow-trend-up', 'bg-emerald-500', `${receitas.length} transações`) : ''}
                ${hasPermission('vagas') ? kpiCard('Vagas Abertas', vagasAbertas, 'fa-briefcase', 'bg-yellow-500', `${vagasFechadas} vagas fechadas`) : ''}
                ${hasPermission('contas') ? kpiCard('Saldo em Contas', formatCurrency(saldoTotalContas), 'fa-university', saldoTotalContas >= 0 ? 'bg-purple-500' : 'bg-orange-500', `${appData.bankAccounts.length} contas cadastradas`) : ''}
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6 fade-in">
                ${hasPermission('financeiro') ? `<div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200"><h3 class="text-lg font-semibold text-slate-800 mb-3">Fluxo de Caixa</h3><canvas id="cashFlowChart" height="100"></canvas></div>` : ''}
                ${hasPermission('vagas') ? `<div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200"><h3 class="text-lg font-semibold text-slate-800 mb-3">Status das Vagas</h3><canvas id="vagasChart" height="200"></canvas></div>` : ''}
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 fade-in">
                <h3 class="text-lg font-semibold text-slate-800 mb-4"><i class="fas fa-user-shield mr-2 text-primary-600"></i>Suas Permissões</h3>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    ${AVAILABLE_MODULES.filter(m => m.id !== 'usuarios').map(m => `
                        <div class="flex items-center space-x-2 p-3 ${hasPermission(m.id) ? 'bg-green-50 border border-green-200' : 'bg-gray-50 border border-gray-200 opacity-50'} rounded-lg">
                            <i class="fas ${m.icon} ${hasPermission(m.id) ? 'text-green-600' : 'text-gray-400'}"></i>
                            <span class="text-sm font-medium ${hasPermission(m.id) ? 'text-green-800' : 'text-gray-500'}">${m.name}</span>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
        setTimeout(renderCharts, 100);
    }

    function kpiCard(title, value, icon, bgColor, subtitle) {
        return `<div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 card-hover">
            <div class="flex justify-between items-start">
                <div><p class="text-sm font-medium text-slate-500">${title}</p><p class="text-2xl font-bold text-slate-800 mt-1">${value}</p><p class="text-xs text-slate-400 mt-2">${subtitle}</p></div>
                <div class="p-3 ${bgColor} rounded-lg text-white shadow-sm"><i class="fas ${icon} text-lg"></i></div>
            </div></div>`;
    }

    function renderCharts() {
        if (hasPermission('financeiro')) {
            const ctx1 = document.getElementById('cashFlowChart');
            if (ctx1) {
                new Chart(ctx1, { type: 'bar', data: { labels: ['Receitas', 'Despesas', 'Lucro'], datasets: [{ label: 'Valores (R$)', data: [appData.transactions.filter(t => t.type === 'RECEITA').reduce((s, t) => s + t.value, 0), appData.transactions.filter(t => t.type === 'DESPESA').reduce((s, t) => s + t.value, 0), appData.transactions.filter(t => t.type === 'RECEITA').reduce((s, t) => s + t.value, 0) - appData.transactions.filter(t => t.type === 'DESPESA').reduce((s, t) => s + t.value, 0)], backgroundColor: ['#10b981', '#ef4444', '#8b5cf6'], borderRadius: 8, barThickness: 40 }] }, options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: '#f1f5f9' } }, x: { grid: { display: false } } } } });
            }
        }
        if (hasPermission('vagas')) {
            const ctx2 = document.getElementById('vagasChart');
            if (ctx2) {
                const statusVagas = ['ABERTO', 'FECHADO', 'CANCELADO', 'CONGELADO'];
                const colors = ['#84cc16', '#166534', '#ef4444', '#1e3a8a'];
                const data = statusVagas.map(s => appData.vacancies.filter(v => v.status === s).length);
                new Chart(ctx2, { type: 'doughnut', data: { labels: ['Abertas', 'Fechadas', 'Canceladas', 'Congeladas'], datasets: [{ data, backgroundColor: colors, borderWidth: 0, cutout: '70%' }] }, options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, padding: 10, font: { size: 11 } } } } } });
            }
        }
    }

    async function deleteTransaction(id) { if (confirm('Excluir esta transação?')) { const trans = appData.transactions.find(t => t.id === id); if (trans && trans.grupoId) { if (confirm('Esta transação faz parte de um parcelamento. Excluir TODAS as parcelas?')) appData.transactions = appData.transactions.filter(t => t.grupoId !== trans.grupoId); else appData.transactions = appData.transactions.filter(t => t.id !== id); } else { appData.transactions = appData.transactions.filter(t => t.id !== id); } await saveData(); renderPage('financeiro'); } }

    function openBankAccountModal(id = null) {
        const account = id ? appData.bankAccounts.find(b => b.id === id) : null;
        document.getElementById('modal-content').innerHTML = `
            <div class="p-6">
                <div class="flex justify-between items-center mb-5"><h3 class="text-xl font-bold text-slate-800">${account ? 'Editar' : 'Nova'} Conta Bancária</h3><button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times text-xl"></i></button></div>
                <form id="bankForm" class="space-y-4">
                    <div><label class="block text-sm font-medium text-slate-700 mb-1">Nome da Conta *</label><input type="text" id="b_nome" value="${account ? account.nome : ''}" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none" required></div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-sm font-medium text-slate-700 mb-1">Tipo de Conta *</label><select id="b_tipo" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none">${TIPOS_CONTA.map(t => `<option value="${t}" ${account && account.tipo === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
                        <div><label class="block text-sm font-medium text-slate-700 mb-1">Tipo de Pessoa *</label><select id="b_tipoPessoa" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none">${TIPOS_PESSOA.map(t => `<option value="${t}" ${account && account.tipoPessoa === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
                    </div>
                    <div><label class="block text-sm font-medium text-slate-700 mb-1">Saldo Inicial (R$)</label><input type="number" step="0.01" id="b_saldo" value="${account ? account.saldoInicial : 0}" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none"></div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-sm font-medium text-slate-700 mb-1">Cor da Conta</label><input type="color" id="b_cor" value="${account ? account.cor : '#2563eb'}" class="w-full h-10 border border-slate-300 rounded-lg cursor-pointer"></div>
                        <div><label class="block text-sm font-medium text-slate-700 mb-1">Ícone</label><select id="b_icone" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none">${ICONES_BANCOS.map(i => `<option value="${i}" ${account && account.icone === i ? 'selected' : ''}>${i.replace('fa-', '')}</option>`).join('')}</select></div>
                    </div>
                    <button type="submit" class="w-full bg-primary-600 text-white py-2.5 rounded-lg hover:bg-primary-700 transition font-medium mt-4">Salvar Conta</button>
                </form>
            </div>
        `;
        openModal();
        document.getElementById('bankForm').onsubmit = async (e) => { e.preventDefault(); const data = { nome: document.getElementById('b_nome').value, tipo: document.getElementById('b_tipo').value, tipoPessoa: document.getElementById('b_tipoPessoa').value, saldoInicial: parseFloat(document.getElementById('b_saldo').value) || 0, cor: document.getElementById('b_cor').value, icone: document.getElementById('b_icone').value }; if (account) Object.assign(account, data); else appData.bankAccounts.push({ id: 'b' + Date.now(), ...data }); await saveData(); closeModal(); renderPage('contas'); };
    }
    async function deleteBankAccount(id) { if (confirm('Excluir esta conta bancária? As transações vinculadas ficarão sem conta.')) { appData.bankAccounts = appData.bankAccounts.filter(b => b.id !== id); appData.transactions.forEach(t => { if (t.contaId === id) t.contaId = null; }); await saveData(); renderPage('contas'); } }

    function openInstallmentModal(id = null) {
        const inst = id ? appData.parcelamentos.find(p => p.id === id) : null;
        const allCats = [...appData.categories.receitas.map(c => ({ ...c, type: 'RECEITA' })), ...appData.categories.despesas.map(c => ({ ...c, type: 'DESPESA' }))];
        document.getElementById('modal-content').innerHTML = `
            <div class="p-6">
                <div class="flex justify-between items-center mb-5"><h3 class="text-xl font-bold text-slate-800">${inst ? 'Editar' : 'Novo'} Parcelamento</h3><button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times text-xl"></i></button></div>
                <form id="instForm" class="space-y-4">
                    <div><label class="block text-sm font-medium text-slate-700 mb-1">Descrição *</label><input type="text" id="i_desc" value="${inst ? inst.desc : ''}" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none" required></div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-sm font-medium text-slate-700 mb-1">Valor Total (R$) *</label><input type="number" step="0.01" id="i_value" value="${inst ? inst.valueTotal : ''}" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none" required></div>
                        <div><label class="block text-sm font-medium text-slate-700 mb-1">Nº de Parcelas *</label><input type="number" id="i_parcelas" min="1" max="48" value="${inst ? inst.parcelas : 12}" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none" required></div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-sm font-medium text-slate-700 mb-1">Categoria *</label><select id="i_cat" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none">${allCats.map(c => `<option value="${c.id}" ${inst && inst.catId === c.id ? 'selected' : ''}>${c.nome} (${c.type})</option>`).join('')}</select></div>
                        <div><label class="block text-sm font-medium text-slate-700 mb-1">Data da 1ª Parcela *</label><input type="date" id="i_dataInicio" value="${inst ? inst.dataInicio : new Date().toISOString().split('T')[0]}" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none" required></div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-sm font-medium text-slate-700 mb-1">Forma de Pagamento</label><select id="i_forma" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none">${FORMAS_PAGAMENTO.map(f => `<option value="${f}" ${inst && inst.formaPagamento === f ? 'selected' : ''}>${f}</option>`).join('')}</select></div>
                        <div><label class="block text-sm font-medium text-slate-700 mb-1">Tipo Pessoa</label><select id="i_tipoPessoa" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none">${TIPOS_PESSOA.map(t => `<option value="${t}" ${inst && inst.tipoPessoa === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
                    </div>
                    <div><label class="block text-sm font-medium text-slate-700 mb-1">Conta Bancária *</label><select id="i_conta" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none"><option value="">Selecione...</option>${appData.bankAccounts.map(b => `<option value="${b.id}" ${inst && inst.contaId === b.id ? 'selected' : ''}>${b.nome} (${b.tipoPessoa})</option>`).join('')}</select></div>
                    <button type="submit" class="w-full bg-purple-600 text-white py-2.5 rounded-lg hover:bg-purple-700 transition font-medium mt-4">Salvar Parcelamento</button>
                </form>
            </div>
        `;
        openModal();
        document.getElementById('instForm').onsubmit = async (e) => { e.preventDefault(); const selectedCat = allCats.find(c => c.id === document.getElementById('i_cat').value); const data = { desc: document.getElementById('i_desc').value, catId: selectedCat.id, type: selectedCat.type, valueTotal: parseFloat(document.getElementById('i_value').value), parcelas: parseInt(document.getElementById('i_parcelas').value), dataInicio: document.getElementById('i_dataInicio').value, formaPagamento: document.getElementById('i_forma').value, tipoPessoa: document.getElementById('i_tipoPessoa').value, contaId: document.getElementById('i_conta').value, status: 'ATIVO' }; if (inst) Object.assign(inst, data); else appData.parcelamentos.push({ id: 'p' + Date.now(), ...data }); const grupoId = 'pg' + Date.now(); const valorParcela = data.valueTotal / data.parcelas; for (let i = 0; i < data.parcelas; i++) { const d = new Date(data.dataInicio + 'T00:00:00'); d.setMonth(d.getMonth() + i); appData.transactions.push({ id: 'pt' + Date.now() + '_' + i, desc: `${data.desc} (${i + 1}/${data.parcelas})`, catId: data.catId, type: data.type, value: valorParcela, date: d.toISOString().split('T')[0], status: 'PENDENTE', formaPagamento: data.formaPagamento, tipoPessoa: data.tipoPessoa, parcelamento: data.parcelas, parcelaAtual: i + 1, contaId: data.contaId, grupoId: grupoId }); } await saveData(); closeModal(); renderPage('parcelamentos'); };
    }
    async function deleteInstallment(id) { if (confirm('Excluir este parcelamento e todas as suas parcelas?')) { const inst = appData.parcelamentos.find(p => p.id === id); if (inst) { const relatedTrans = appData.transactions.filter(t => t.desc.startsWith(inst.desc)); relatedTrans.forEach(t => { appData.transactions = appData.transactions.filter(x => x.id !== t.id); }); } appData.parcelamentos = appData.parcelamentos.filter(p => p.id !== id); await saveData(); renderPage('parcelamentos'); } }

    function openCategoryModal(tipo) {
        document.getElementById('modal-content').innerHTML = `
            <div class="p-6">
                <div class="flex justify-between items-center mb-5"><h3 class="text-xl font-bold text-slate-800">Nova Categoria de ${tipo === 'receita' ? 'Receita' : 'Despesa'}</h3><button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times text-xl"></i></button></div>
                <form id="catForm" class="space-y-4">
                    <div><label class="block text-sm font-medium text-slate-700 mb-1">Nome da Categoria *</label><input type="text" id="cat_nome" placeholder="Ex: Receita- Consultoria" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none" required></div>
                    <div><label class="block text-sm font-medium text-slate-700 mb-1">Tipo</label><select id="cat_tipo" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none"><option value="Recorrente">Recorrente</option><option value="Pontual">Pontual</option><option value="Variável">Variável</option><option value="Fixo">Fixo</option></select></div>
                    <button type="submit" class="w-full bg-primary-600 text-white py-2.5 rounded-lg hover:bg-primary-700 transition font-medium mt-4">Adicionar Categoria</button>
                </form>
            </div>
        `;
        openModal();
        document.getElementById('catForm').onsubmit = async (e) => { e.preventDefault(); const newCat = { id: (tipo === 'receita' ? 'r' : 'd') + Date.now(), nome: document.getElementById('cat_nome').value, tipo: document.getElementById('cat_tipo').value }; if (tipo === 'receita') appData.categories.receitas.push(newCat); else appData.categories.despesas.push(newCat); await saveData(); closeModal(); renderPage('config'); };
    }
    async function deleteCategory(tipo, id) { if (confirm('Excluir esta categoria?')) { if (tipo === 'receita') appData.categories.receitas = appData.categories.receitas.filter(c => c.id !== id); else appData.categories.despesas = appData.categories.despesas.filter(c => c.id !== id); await saveData(); renderPage('config'); } }
    </script>
</body>
</html>
